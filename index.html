<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0f14" />
    <meta name="description" content="Cat & Mouse — a turn-based puzzle chase. Escape the hunter or become the hunter." />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Cat & Mouse — The Escape</title>
    <style>
      #install-app {
        position: fixed;
        z-index: 9999;
        top: max(12px, env(safe-area-inset-top));
        right: max(12px, env(safe-area-inset-right));
        border: 1px solid #4b4b4b;
        border-radius: 10px;
        padding: 9px 12px;
        background: #171717;
        color: #f5f2ea;
        font: 800 11px/1 system-ui, sans-serif;
        letter-spacing: .08em;
        cursor: pointer;
        box-shadow: 0 5px 18px #0008;
      }
      #install-app:hover { background: #242424; }
      #install-app:focus-visible { outline: 2px solid #f5f2ea; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <section id="rewarded-ads-panel" class="rewarded-ads-panel" hidden aria-label="Optional rewarded ads">
      <div>
        <p class="rewarded-ads-eyebrow">OPTIONAL REWARD</p>
        <strong>WATCH AN AD · +15 🪙</strong>
        <p id="rewarded-ad-status" class="rewarded-ad-status" aria-live="polite">Rewarded ads are optional and never required to play.</p>
      </div>
      <button id="rewarded-ad-button" type="button" disabled>WATCH AD · +15 🪙</button>
    </section>
    <button id="install-app" type="button" hidden aria-label="Install Cat and Mouse as an app">INSTALL APP</button>
    <script src="/ads-config.js"></script>
    <script src="/rewarded-ads.js"></script>
    <script src="/install.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
